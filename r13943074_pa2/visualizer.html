<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floorplan Visualizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 20px;
        }
        #controls {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
        }
        #canvas-container {
            border: 1px solid #ccc;
            position: relative;
            overflow: auto;
            margin-bottom: 20px;
        }
        canvas {
            display: block;
        }
        #info-panel {
            border: 2px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            min-height: 100px;
            margin-top: 20px;
        }
        .toggle-button {
            padding: 8px 12px;
            border-radius: 5px;
            background-color: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.3s ease;
        }
        .toggle-button.active {
            background-color: #000000;
            border: 2px solid #000000;
            color: white;
        }
        #fileInput {
            display: none;
        }
        #loadButton1, #loadButton2, #loadButton3, #loadButton4, #loadButton5 {
            padding: 8px 12px;
            background-color: #000000;
            border: 2px solid #000000;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #loadButton1:hover, #loadButton2:hover, #loadButton3:hover, #loadButton4:hover, #loadButton5:hover {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
        }
        #scale-slider {
            width: 200px;
        }
        #scale-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
    </style>
</head>
<body>
    <h1>Floorplan Visualizer</h1>
    
    <div id="controls">
        <!-- <button id="loadButton" onclick="document.getElementById('fileInput').click()">Load JSON File</button> -->
        <!-- <input type="file" id="fileInput" accept=".json"> -->
        <button id="loadButton1" onclick="loadJSONFile1()">ami33</button>
        <button id="loadButton2" onclick="loadJSONFile2()">ami49</button>
        <button id="loadButton3" onclick="loadJSONFile3()">apte</button>
        <button id="loadButton4" onclick="loadJSONFile4()">hp</button>
        <button id="loadButton5" onclick="loadJSONFile5()">xerox</button>

        <div id="scale-slider-container">
            <label for="scale-slider">Zoom: </label>
            <input type="range" id="scale-slider" min="0.01" max="1" step="0.01" value="1">
            <span id="scale-value">1x</span>
        </div>

        <div class="toggle-button active" id="toggle-blocks">Show Blocks</div>
        <div class="toggle-button active" id="toggle-terminals">Show Terminals</div>
        <div class="toggle-button active" id="toggle-nets">Show Nets</div>
        <div class="toggle-button active" id="toggle-labels">Show Labels</div>
    </div>

    <h3 class="current-file"></h3>
    
    <div id="canvas-container">
        <canvas id="floorplanCanvas"></canvas>
    </div>
    
    <div id="info-panel">
        <h3>Information</h3>
        <div id="info-content">Load a JSON file to see floorplan details.</div>
    </div>

    <script src="visualizer.js"></script>
</body>
</html>
